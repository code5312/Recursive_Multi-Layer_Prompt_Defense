app:
  semver: "1.0.0"

orchestrator:
  enable_input_lce: true
  enable_recursive_cot: true
  enable_tool_verify: true
  enable_cross_correction: true
  enable_output_lce: true
  very_high_risk: 0.95

lce:
  input:
    model_path: "models/input_lce"
    threshold: 0.60
  output:
    model_path: "models/output_lce"
    threshold: 0.65

cot:
  max_steps: 5

cross_correction:
  threshold: 0.78

tools:
  specs_path: "data/raw/toolspecs.json"

logging:
  log_dir: "logs/runtime"
  redact_keys: ["api_key", "token", "password"]
  rotate_mb: 10
