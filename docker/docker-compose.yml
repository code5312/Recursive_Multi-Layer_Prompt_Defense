# docker/docker-compose.yml
# usage:
#   cd docker
#   docker compose up --build
version: "3.9"
services:
  recurdefend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: recurdefend:latest
    container_name: recurdefend
    environment:
      - RECURDEFEND_TOOLSPECS=/app/data/raw/toolspecs.json
      - UVICORN_WORKERS=2
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../configs:/app/configs:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
